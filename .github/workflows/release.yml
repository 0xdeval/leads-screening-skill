name: Release skill archive

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m unittest discover -s candidate-screening/tests -v
      - name: Check marketplace plugin copy
        run: ./scripts/check-plugin-sync.sh
      - name: Build skill archive
        run: ./scripts/package-skill.sh
      - name: Validate release archives
        run: |
          unzip -t dist/candidate-screening-plugin.zip
          unzip -p dist/candidate-screening-plugin.zip .claude-plugin/plugin.json | python3 -m json.tool
          unzip -t dist/candidate-screening-skill.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/candidate-screening-plugin.zip dist/candidate-screening-skill.zip --generate-notes
